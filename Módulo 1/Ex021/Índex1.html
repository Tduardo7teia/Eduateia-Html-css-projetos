  <title>Modelos de Caixa</title>
  <style>
    body{
      background-color:#11b7d9;
    }
    h1{
      
      <!-- o border: É a cerca em volta do conteúdo h1,ou h2 etc; o padding: É O
      espaço no meio entre o border, e h1 ou mais; agora vamos simplificar a
      nossa vida usando shorthand:-->
      background-color:#858788;
      width: 200px;
      height: 200px;
      border:10px solid
      darkgreen;
      padding: 10px;
      
      
      <!important--esses são codigos da aula 02 do capitulo 16-->
      margin-top: 20px;
      margin-right: 20px;
      margin-bottom: 20px;
      margin-left: 20px;
      outline: 5px dashed
       salmon;
    }
    a{ 
      border-width:1px ;
      border-style:solid ;
      border-color: red;
    }
  </style>
</head>
