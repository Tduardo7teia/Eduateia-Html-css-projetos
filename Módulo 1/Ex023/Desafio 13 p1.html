<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Desafio de Tabela parte 1</title>
  <style>
    body{
      font-family: Arial,Helvetiva,sans-serif;
      
    }
    table{
      width:500px;
      border-collapse: collapse;
    }
     tr td {
      border: 1px solid black;
      
      padding:10px;
      text-align: center;
    }
    th{
      border:1px solid white;
      padding:10px;
      background-color:black;
      color:white;
    }
  </style>
  
</head>
<body>
  <table>
  <th>A</th>
  <th>B</th>
  <th>C</th>
  <th>D</th>
  <tr>
    <td>1</td>
    <td>2</td>
    <td rowspan="2">3</td>
    <td>4</td>
    
  </tr>
  <tr>
    <td>5</td>
    <td>6</td>
    <td>7</td>
    
    
  </tr>
  <tr>
    <td colspan="3">8</td>
    <td>9</td>
  
  </tr>
  <tr>
  <td rowspan="2">10</td>
  <td colspan="2">11</td>
  <td>12</td>
    
    
  </tr>
  
  <tr>
  
  <td>13</td>
  <td>14</td>
  <td>15</td>
    
    
  </tr>
  
  </table>
  
</body>
</html>
