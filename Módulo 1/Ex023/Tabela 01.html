<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Minha prim tabela</title>
  <style>
    body{
      font-family: Arial,Helvetica,sans-serif;
    }
    table{
      width: 400px;
      height: 400px;
    }
    td{
      border: 1px solid black;
      padding: 8px;
      border-collapse: collapse;
      text-align:center ;
      vertical-align: middle;
      
    }
    .numero{
      text-align: right;
    }
    td.linha,cor{
      background-color: darkgray;
    }
    td.cor{
      background-color:yellow;
    }
    
  </style>
</head>
<body>
  <h1> Minha primeira tabela</h1>
  <table>
    <tr><!--primeira linha-->
    <td>A1</td>
    <td>B1</td>
    <td>C1</td></tr>
    <tr><!--Segunda linha-->
    <td>A2</td>
    <td>B2</td>
    <td>C2</td></tr>
    <tr><!--Terceira linha-->
    <td class="linha">A3</td>
    <td class="numero">B3</td>
    <td>C3</td></tr>
    <tr><!--Linha linha-->
    <td class="cor">A4</td>
    <td>B4</td>
    <td>C4</td></tr>
  </table>
</body>
</html>
