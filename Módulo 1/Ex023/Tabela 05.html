<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Exercício das Tabelas</title>
  <style>
    body{
      font-family: Arial,Helvetica,Sans-Serif;
    }
    table{
      width:500px;
      border-collapse:collapse;
    }
    tr th{
      border:1px solid black;
      padding:10px;
    }
    td{
      border:1px solid black;
      padding:10px;
    }
    .cnome{
      background-color: darkgray;
    }
  </style>
</head>
<body>
  <table>
    <caption>
      Cadastro
    </caption>
    <colgroup>
      <col class="cnome" span="4">
      <col class="csexo">
      <col class="cidade">
      <col class="cprofossão">
    </colgroup>
    
    <tr>
      <th scope="col">Nome</th>
      <th scope="col">Sexo</th>
      <th scope="col">Idade</th>
      <th scope="col">Profissão</th>
    </tr>
    <tr>
      <td>Ana Maria</td>
      <td>F</td>
      <td>25</td>
      <td>Jornalista</td>
    </tr>
    <tr>
      <td>Eduardo</td>
      <td>M</td>
      <td>19</td>
      <td>Programador</td>
    </tr>
    <tr>
      <td>Gustavo</td>
      <td>M</td>
      <td>42</td>
      <td>Professor</td>
    </tr>
    <tr>
      <td>Hélio</td>
      <td>M</td>
      <td>19</td>
      <td>Vendedor</td>
    </tr>
    <tr>
      <td>Maria</td>
      <td>F</td>
      <td>39</td>
      <td>Médica</td>
    </tr>
    <tr>
      <td>Otávio</td>
      <td>M</td>
      <td>22</td>
      <td>Nitricionistas</td>
    </tr>
  </table>
</body>
</html>
