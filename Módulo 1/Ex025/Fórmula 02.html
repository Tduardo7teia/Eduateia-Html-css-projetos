<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Formulário02</title>
</head>
<body>
  
  <form method="post" action="cadastro.php" autocomplete="on">
    <p> <label for="iusuar"> Usuário: </label><input type="text" name="usoa"
    id="iusuar" required minlength="5" maxlength="15" size="10"
    placeholder="Nome de usuário"></p>
  <p> <label for="isua"> Senha: </label><input type="password" name="usua"
  id="isua" required minlength="8" maxlength="15" size="10"
  autocomplete="current-password" placeholder="no mínimo 8 cacter"></p>
  <p> <input type="submit" value="Enviar">
   <input type="reset" value="Limpar"></p>
  </form>
</body>
</html>
