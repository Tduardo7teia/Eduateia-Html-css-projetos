<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Formulário 07</title>
</head>
<body>  <form action="cadastro.php" method="post" autocomplete="on">
  <p>
  <label for="ieas">Estado</label>
  <select name="estado" id="ieas">
    <option value="" selected> ----- Escolha-----</option>
    <optgroup label="Região Sudeste">
    <option value="MG">Minas Gerais</option>
    <option value="RJ">Rio de Janeiro</option>
    <option value="SP" >São Paulo</option>
    </optgroup>
    <optgroup label="Região Nordeste">
    <option value="MA">Maranhão</option>
    <option value="PE">Pernambuco</option>
    <option value="RN"> Rio Grande do Norte</option>
    </optgroup>
    </p>
  </select>
  <p>
    <label for="prof">Profissão:</label>
    <input type="text" name="profissão" id="prof" list="isoprof">
    <datalist id="isoprof">
      <option value="AD">Admistrador</option>
      <option value="PR">Professor</option>
      <option value="MD">Médico</option>
      <option value="DR">Doutor</option>
    </datalist>
    <p>
      <label for="mg">Mensagem:</label><br>
      <textarea name="meg" id="mg" cols="30" rows="10"></textarea>
    </p>
    
    
  </p>
      <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
