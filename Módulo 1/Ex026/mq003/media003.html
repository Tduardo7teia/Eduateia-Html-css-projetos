<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="allstyle.css">
    <style>
    /* configurando o media quiries localmente numa unica pagina no head*/
      *{
        margin: 0px;
        padding: 0px;
      }
      html,body{
        width: 100vw;
        height: 100vh;
        background-color:#233eff ;
        background-size: contain;
        background-repeat: no-repeat;
      }
      h1{
        color: white;
        text-shadow: 2px 2px 0px#1526a7;
      }
      /* de retrato*/
      @media screen and (orientation: portrait){
        
      }
      body{
        background-image:url('cev-portrait.jpg') ;
        background-position: center bottom;
      }
      
      
      @media screen and (orientation: landscape){
       body{
        background-image: url('cev-landscape.jpg');
        background-position: left bottom;
      }
      
      
   </style>
</head>
<body>
  <h1>Usando medea quiries feature</h1>
</body>
</html>
